<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
	<h1 class="main-title">Spielerprofil</h1>

		<div class="stats-box" style="background-color: #1e1e1e; padding: 20px; border-radius: 5px; max-width: 340px; margin: 20px auto; text-align: center;">
			<p style="color: #aaaaaa; font-family: 'Changa', sans-serif; font-size: 1.2em; margin: 0;">Deine aktuellen Punkte</p>
			<p style="color: #e50914; font-family: 'Changa', sans-serif; font-size: 3em; font-weight: bold; margin: 10px 0;">---</p>
		</div>
		
		<div style="text-align: center; margin-top: 30px;">
			<button id="btn-logout" style="background-color: #2a2a2a; color: #ffffff; border: none; padding: 10px 20px; font-family: 'Changa', sans-serif; font-weight: bold; cursor: pointer; border-radius: 5px;">Abmelden</button>
		</div>
	</div>

			window.location.href = "login.html";

</html>
