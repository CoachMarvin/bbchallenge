<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mein Profil - Leaderboard</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
	<nav class="navbar">
		<div class="nav-logo">Sieglar Leaderboard</div>
		<div class="nav-links">
			<a href="challenges.html" class="nav-item">Challenges</a>
			<a href="login.html" class="nav-item login-btn">Admin Login</a>
		</div>
	</nav>

	<h1 class="main-title">Spielerprofil</h1>
	
	
	<div class="profile-container">
		<h2 id="welcome-message" style="color: #ffffff; font-family: 'Changa', sans-serif; text-align: center; font-size: 2em;">Lädt...</h2>
		<div class="stats-box" style="background-color: #1e1e1e; padding: 20px; border-radius: 5px; max-width: 340px; margin: 20px auto; text-align: center;">
			<p style="color: #aaaaaa; font-family: 'Changa', sans-serif; font-size: 1.2em; margin: 0;">Deine aktuellen Punkte</p>
			<p style="color: #e50914; font-family: 'Changa', sans-serif; font-size: 3em; font-weight: bold; margin: 10px 0;">---</p>
		</div>
		
		<div class="profile-nav-container">
			<a href="index.html" class="btn-login-nav">Zum Leaderboard</a>
			
			<button id="btn-logout" class="btn-login-nav btn-logout-gray">Abmelden</button>
		</div>
	</div>
	
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
		import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
		
		const firebaseConfig = {
    apiKey: "AIzaSyCG-yi8KlJPlDvVTNJEoM3aTa-_O7jP9Rk",
    authDomain: "basketball-leaderboard-sieglar.firebaseapp.com",
    projectId: "basketball-leaderboard-sieglar",
    storageBucket: "basketball-leaderboard-sieglar.firebasestorage.app",
    messagingSenderId: "158682616904",
    appId: "1:158682616904:web:df76d3f6b67f3a7e35f47d",
    measurementId: "G-9DPK112PLB"
  };
  
	const app = initializeApp(firebaseConfig);
	const auth = getAuth(app);
	
	const welcomeMessage = document.getElementById('welcome-message');
	const btnLogout = document.getElementById('btn-logout');
	
	//Prüfen ob User eingeloggt ist
	onAuthStateChanged(auth, (user) => {
		if (user) {
			if (welcomeMessage) {
				welcomeMessage.innerText = "Hi, " + user.email + "!";
			}
		} else {
			window.location.href = "login.html";
		}
	});
	
	//Abmelden Button aktivieren
	if (btnlogout) {
		btnLogout.addEventListener('click', () => {
			signOut(auth).then(() => {
				window.location.href = "login.html";
			}).catch((error) => {
				alert("Fehler beim Abmelden!");
			});
		});
	}
	</script>
</body>
</html>
