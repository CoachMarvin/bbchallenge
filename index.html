<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>
		BB Challenge
	</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
	<nav class="navbar">
		<div class="nav-logo">Sieglar Legends</div>
		<div class="nav-links">
			<a href="challenges.html" class="nav-item">Challenges</a>
			<a href="login.html" class="nav-item login-btn">Admin Login</a>
		</div>
	</nav>

	<h1 class="main-title">Leaderboard</h1>
	
	
	<div class="form-container" id="admin-eintrag-form">
		<div class="admin-section border-bottom">
			<h3 class="admin-title">Punkte hinzufügen</h3>
			<div class="admin-row">
				<select id="admin-spieler-select" class="admin-input">
					<option value="">-- Spieler auswählen --</option>
				</select>
				<input type="number" id="admin-punkte-add" placeholder="+ Punkte" class="admin-input punkte-width">
			</div>
			<button id="btn-punkte-buchen" class="login-btn full-width">Punkte buchen</button>
		</div>
		
		<div class="admin section">
			<h3 class="admin-title">Neuen Spieler anlegen</h3>
			<div class="admin-row">
				<input type="text" id="admin-neu-name" placeholder="Name" class="admin-input">
			</div>
			<button id="btn-spieler-anlegen" class="login-btn full-width btn-secondary">Spieler erstellen</button>
		</div>
	</div>
	
	<div id="leaderboard">
	
	</div>
	
	<div class="podium-container">

	</div>
	
	<div class="liste-container">

	</div>
	
	<script type="module" src="script.js"></script>

</body>

</html>
